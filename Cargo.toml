[package]
name = "quantova-cli"
version = "0.1.5"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The Quantova command line client. A terminal tool for post quantum accounts, signed transactions, contract deploy and call, and node queries over the Quantova gateway, built on the QCore Rust core so no signing or wire is ever hand rolled."
repository = "https://github.com/Quantova/quantova-cli"
keywords = ["post-quantum", "blockchain", "cli", "wallet", "quantova"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

[[bin]]
name = "qtv"
path = "src/main.rs"

[dependencies]
qcore = { path = "../QCore.rs" }
qtv-wipe = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "9aff32ff682334237522458e6f95e8cf11085c72" }
