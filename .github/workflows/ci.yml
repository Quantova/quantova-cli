name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: quantova-cli
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QCore.rs
          ref: e23fd1281af1da2efb610ddf5f975be04b005960
          path: QCore.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/Quantova-Chain
          ref: 3ed57775e1171f870e0236d8d605e07b6dc03761
          path: Quantova-Chain
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QVM
          ref: f7d82abb13a01039d78dca732660fd6700d7b830
          path: QVM
          persist-credentials: false
      - name: fmt
        working-directory: quantova-cli
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: quantova-cli
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: test
        working-directory: quantova-cli
        run: cargo test --all-features --locked
      - name: deny
        working-directory: quantova-cli
        run: |
          cargo install cargo-deny --locked --version 0.16.3
          cargo deny check bans licenses sources advisories
