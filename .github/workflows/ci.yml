name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: quantova-cli
          persist-credentials: false
      - name: resolve cross repo pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          pin() { awk -v k="$1" '$1==k{print $2}' quantova-cli/cross-repo-pins; }
          for k in Q-Crypto Quantova-Chain QVM QCore.rs; do
            v=$(pin "$k")
            case "$v" in
              *[!0-9a-f]* | "") echo "cross-repo-pins $k is not a commit: '$v'" >&2; exit 1 ;;
            esac
            if [ "${#v}" -ne 40 ]; then
              echo "cross-repo-pins $k must name a full commit, not '$v'" >&2; exit 1
            fi
          done
          for k in Q-Crypto Quantova-Chain QVM; do
            locked=$(grep -oE "$k\\.git\\?rev=[0-9a-f]{40}" quantova-cli/Cargo.lock | sed "s/.*rev=//" | sort -u)
            if [ "$locked" != "$(pin "$k")" ]; then
              echo "Cargo.lock $k does not match the pinned $(pin "$k")" >&2
              echo "$locked" >&2
              exit 1
            fi
          done
          echo "qcore_rs=$(pin QCore.rs)" >> "$GITHUB_OUTPUT"
          echo "quantova_chain=$(pin Quantova-Chain)" >> "$GITHUB_OUTPUT"
          echo "qvm=$(pin QVM)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Quantova/QCore.rs
          ref: ${{ steps.pins.outputs.qcore_rs }}
          path: QCore.rs
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Quantova/Quantova-Chain
          ref: ${{ steps.pins.outputs.quantova_chain }}
          path: Quantova-Chain
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Quantova/QVM
          ref: ${{ steps.pins.outputs.qvm }}
          path: QVM
          persist-credentials: false
      - name: fmt
        working-directory: quantova-cli
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: quantova-cli
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: test
        working-directory: quantova-cli
        run: cargo test --all-features --locked
      - name: deny
        working-directory: quantova-cli
        run: |
          cargo install cargo-deny --locked --version 0.19.9
          cargo deny --locked check bans licenses sources advisories
